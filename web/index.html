<!DOCTYPE html>
<html>
<head>
 
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">


  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_sdui_frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">


  <meta name="theme-color" content="#000000">


  <link rel="icon" type="image/svg+xml" href="assets/glimpse.svg">
  <link rel="alternate icon" href="icons/Icon-192.png">

  <title>flutter_sdui_frontend</title>
  <link rel="manifest" href="manifest.json">


  <style>
    html, body { height: 100%; }

    body { margin: 0; background: #000000; }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 9999;
    }
   
    #splash img {
      width: 120px;
      height: 120px;
      max-width: 40vmin;
      max-height: 40vmin;
      filter: none;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="assets/glimpse.svg" alt="Loading">
  </div>
  <script>
   
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
